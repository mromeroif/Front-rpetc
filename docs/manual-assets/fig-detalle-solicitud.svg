<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" viewBox="0 0 640 260" role="img" aria-labelledby="t d">
  <title id="t">Request detail - query data and Obtener documento</title>
  <desc id="d">Gray box with period and RUTs; primary Obtener documento button.</desc>
  <rect width="640" height="260" fill="#fff" stroke="#dee2e6"/>
  <text x="20" y="32" fill="#333" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600">Detalle solicitud</text>
  <rect x="480" y="14" width="140" height="28" rx="4" fill="#fff" stroke="#6c757d"/>
  <text x="492" y="32" fill="#333" font-family="Segoe UI, sans-serif" font-size="11">Volver a Solicitudes</text>
  <rect x="20" y="52" width="600" height="110" rx="6" fill="#e9ecef" stroke="#ced4da"/>
  <text x="32" y="78" fill="#333" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600">Datos de la consulta solicitada</text>
