name: Deploy QA to S3

on:
  push:
    branches:
      - qa
  workflow_dispatch:

concurrency:
  group: qa-frontend
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: npm install

      - name: Build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://tk31h2efqk.execute-api.us-east-1.amazonaws.com' }}
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "Error: VITE_API_BASE_URL vacio. Configura el secret en environment qa." >&2
            exit 1
          fi
          echo "Build con API: $VITE_API_BASE_URL"
          npm run build

      - name: Configurar AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy a S3
        run: aws s3 sync dist/ s3://rpetc-dev --delete
