name: Prod - Frontend (S3)

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "scripts/**"
      - ".github/workflows/prod-frontend.yml"
  workflow_dispatch:

concurrency:
  group: prod-frontend
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Deploy frontend productivo
        env:
          STACK_NAME: ${{ vars.STACK_NAME || 'rpetc-modern-app' }}
          FRONTEND_BUCKET: ${{ secrets.FRONTEND_BUCKET }}
          FRONTEND_S3_PREFIX: ${{ vars.FRONTEND_S3_PREFIX || '' }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          SETUP_FRONTEND_HOSTING: ${{ vars.SETUP_FRONTEND_HOSTING || '0' }}
        run: bash scripts/deploy.sh
